[package]
name = "capsule-cli"
description = "capsule: inspect, validate, pack, and unpack Knowledge Capsules (KCP 0.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "capsule"
path = "src/main.rs"

[dependencies]
capsule-core = { path = "../capsule-core" }
capsule-policy = { path = "../capsule-policy" }
capsule-registry = { path = "../capsule-registry" }
capsule-compiler = { path = "../capsule-compiler" }
capsule-resolver = { path = "../capsule-resolver" }
capsule-runtime = { path = "../capsule-runtime" }
capsule-evaluator = { path = "../capsule-evaluator" }
capsule-observatory = { path = "../capsule-observatory" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
tar.workspace = true
flate2.workspace = true
sha2.workspace = true
chrono.workspace = true
aes-gcm = { version = "0.11.0", features = ["getrandom"] }

[dev-dependencies]
capsule-api = { path = "../capsule-api" }

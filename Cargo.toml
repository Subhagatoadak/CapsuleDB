[workspace]
resolver = "2"
members = [
    "capsule-core",
    "capsule-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/subhagatoadak/capsuledb"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
regex = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tar = "0.4"
flate2 = "1"
